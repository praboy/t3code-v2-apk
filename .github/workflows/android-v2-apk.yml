name: Build Android V2 APK

on:
  push:
    branches: [codex/build-android-v2-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      EXPO_NO_DOTENV: "1"
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project
        run: pnpm --filter @t3tools/mobile exec expo prebuild --clean --platform android

      - name: Build installable APK
        run: |
          cd apps/mobile/android
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/T3-Code-V2-Preview.apk
          sha256sum dist/T3-Code-V2-Preview.apk > dist/T3-Code-V2-Preview.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: t3-code-android-v2-preview
          path: dist/T3-Code-V2-Preview.apk*
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v2-preview-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/T3-Code-V2-Preview.apk dist/T3-Code-V2-Preview.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/T3-Code-V2-Preview.apk dist/T3-Code-V2-Preview.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "T3 Code Android V2 Preview" \
              --prerelease \
              --notes "Install alongside the Play Store build. This standalone preview APK embeds its JavaScript bundle and uses orchestration protocol V2."
          fi
